<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>2º Ofício — Retire sua senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-brand">
    <img class="logo" src="assets/logo-cartorio.png" alt="2º Ofício de Notas e Registro de Imóveis" />
    <div class="top-text">
      <p class="top-name">2º Ofício de Notas e Registro de Imóveis</p>
      <p class="top-city">Tabuleiro do Norte — CE</p>
    </div>
  </header>

  <main class="split" id="home">
    <button type="button" class="half half-normal" id="btnNormal" onclick="emitirTabletNormal()">
      <span class="half-title">NORMAL</span>
      <span class="half-sub">Atendimento convencional</span>
    </button>

    <button type="button" class="half half-pref" id="btnPreferencial" onclick="emitirTabletPreferencial()">
      <span class="half-title">PREFERENCIAL</span>
      <span class="half-sub">Idoso, gestante, PCD e prioridades</span>
    </button>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <section class="ticket-overlay" id="ticketOverlay" hidden>
    <div class="ticket-card" id="ticketCard">
      <img class="ticket-logo" src="assets/logo-cartorio.png" alt="" />
      <p class="ticket-brand">2º Ofício de Notas e Registro de Imóveis</p>
      <p class="ticket-type" id="ticketType">Normal</p>
      <p class="ticket-number" id="ticketNumber">—</p>
      <p class="ticket-service" id="ticketService"></p>
      <p class="ticket-time" id="ticketTime"></p>
      <p class="ticket-msg">Aguarde ser chamado no painel</p>
      <button type="button" class="btn-ok" id="btnOk" onclick="fecharTicket()">OK</button>
    </div>
  </section>

  <div id="printArea" class="print-only" aria-hidden="true"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
