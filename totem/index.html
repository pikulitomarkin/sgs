<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SGS — Retire sua senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="screen" id="home">
    <header class="brand">
      <p class="brand-name">SGS</p>
      <h1>Retire sua senha</h1>
      <p class="subtitle">Toque na opção do seu atendimento</p>
    </header>

    <div class="actions">
      <button type="button" class="btn btn-normal" id="btnNormal" onclick="emitirTabletNormal()">
        <span class="btn-label">Normal</span>
        <span class="btn-hint">Atendimento convencional</span>
      </button>

      <button type="button" class="btn btn-pref" id="btnPreferencial" onclick="emitirTabletPreferencial()">
        <span class="btn-label">Preferencial</span>
        <span class="btn-hint">Idoso, gestante, PCD e prioridades legais</span>
      </button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <section class="ticket-overlay" id="ticketOverlay" hidden>
    <div class="ticket-card" id="ticketCard">
      <p class="ticket-brand">SGS</p>
      <p class="ticket-type" id="ticketType">Normal</p>
      <p class="ticket-number" id="ticketNumber">—</p>
      <p class="ticket-service" id="ticketService"></p>
      <p class="ticket-time" id="ticketTime"></p>
      <p class="ticket-msg">Aguarde ser chamado no painel</p>
      <button type="button" class="btn-ok" id="btnOk" onclick="fecharTicket()">OK</button>
    </div>
  </section>

  <!-- Área só para impressão térmica -->
  <div id="printArea" class="print-only" aria-hidden="true"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
