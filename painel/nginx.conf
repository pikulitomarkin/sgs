server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS para proxy HTTPS (voz)
    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
    resolver_timeout 5s;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://novosga:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Voz: TV busca no próprio painel (evita bloqueio do navegador da Smart TV)
    location = /tts {
        set $q $arg_q;
        if ($q = "") { return 400; }
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host translate.google.com;
        proxy_set_header Referer "https://translate.google.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "*/*";
        proxy_pass https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt-BR&q=$q;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Disposition;
        add_header Content-Type "audio/mpeg";
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        proxy_connect_timeout 8s;
        proxy_read_timeout 20s;
    }
}
