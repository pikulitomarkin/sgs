<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2º Ofício — Painel de Chamadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <header class="top">
      <div class="brand-wrap">
        <img class="logo" src="assets/logo-cartorio.png" alt="2º Ofício de Notas e Registro de Imóveis" />
        <div>
          <p class="brand">2º Ofício de Notas e Registro de Imóveis</p>
          <p class="unity" id="unityName">Tabuleiro do Norte — CE</p>
        </div>
      </div>
      <div class="clock" id="clock">--:--</div>
    </header>

    <section class="main-call" id="mainCall">
      <p class="label">Senha</p>
      <p class="senha" id="senhaNumero">—</p>
      <p class="prioridade" id="senhaPrioridade"></p>

      <div class="guiche-block">
        <span class="meta-label">Guichê</span>
        <span class="guiche-value" id="guiche">—</span>
      </div>

      <div class="meta secondary">
        <div class="meta-card">
          <span class="meta-label">Atendente</span>
          <span class="meta-value" id="atendente">—</span>
        </div>
      </div>

      <p class="servico" id="servico"></p>
      <p class="hint" id="hint">Aguardando chamada…</p>
    </section>

    <aside class="history">
      <h2>Últimas</h2>
      <ul id="historyList"></ul>
    </aside>
  </div>

  <audio id="alertSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2Onp6Xh4B7e4GMk5iZk46GfXt7gImSmJmVjYd/e3uBiZKYmZWNh397e4GJkpiZlY2Hf3t7gYmSmJmVjYd/e3uBiZKYmZWNh397e4GJkpiZlY2Hf3t7gYmSmJmVjYd/" type="audio/wav" />
  </audio>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
