<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2º Ofício — Painel de Chamadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <div class="layout">
    <header class="top">
      <div class="brand-wrap">
        <img class="logo" src="assets/logo-cartorio.png?v=10" alt="2º Ofício de Notas e Registro de Imóveis" />
        <div class="brand-text">
          <p class="brand">2º Ofício de Notas e Registro de Imóveis</p>
          <p class="unity" id="unityName">Tabuleiro do Norte — CE</p>
        </div>
      </div>
      <div class="clock" id="clock">--:--</div>
    </header>

    <section class="main-call" id="mainCall">
      <p class="label">Senha</p>
      <p class="senha" id="senhaNumero">—</p>
      <p class="prioridade" id="senhaPrioridade"></p>

      <div class="guiche-block">
        <span class="meta-label">Dirija-se ao</span>
        <span class="guiche-value" id="guiche">—</span>
      </div>

      <p class="atendente-line">Atendente: <span id="atendente">—</span></p>
      <p class="servico" id="servico"></p>
      <p class="hint" id="hint">Aguardando chamada…</p>
    </section>

    <aside class="history">
      <h2>Últimas chamadas</h2>
      <ul id="historyList"></ul>
    </aside>
  </div>

  <audio id="alertSound" preload="auto" playsinline>
    <source src="assets/beep.wav?v=10" type="audio/wav" />
  </audio>

  <button type="button" class="audio-unlock" id="audioUnlock">
    Toque para ativar o som da TV
  </button>
  <p class="audio-status" id="audioStatus" hidden>Áudio ativo</p>

  <script src="config.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
